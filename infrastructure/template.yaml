AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Lolabot Factory - AI Agent Builder SaaS

Parameters:
  DomainName:
    Type: String
    Default: lolabots.com
    Description: Primary domain name
  Environment:
    Type: String
    Default: production
    AllowedValues: [production, staging]

Globals:
  Function:
    Runtime: nodejs20.x
    MemorySize: 128
    Timeout: 10
    Environment:
      Variables:
        BUILDS_BUCKET: !Ref BuildsBucket
        SITE_BUCKET: !Ref SiteBucket
        ENVIRONMENT: !Ref Environment

Resources:
  # ---------- S3 Buckets ----------

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'lolabot-factory-site-${Environment}'
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: 404.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  BuildsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'lolabot-builds-${Environment}'
      LifecycleConfiguration:
        Rules:
          - Id: ExpireBuilds
            Status: Enabled
            ExpirationInDays: 30
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ['*']
            AllowedMethods: [GET]
            AllowedHeaders: ['*']

  BuildsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BuildsBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub '${BuildsBucket.Arn}/builds/*'

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: 's3:GetObject'
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  # ---------- API Gateway ----------

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: api
      CorsConfiguration:
        AllowOrigins:
          - !Sub 'https://${DomainName}'
          - 'http://localhost:3000'
        AllowMethods: ['GET', 'POST', 'OPTIONS']
        AllowHeaders: ['Content-Type']

  # ---------- Lambda Functions ----------

  BuildAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'lolabot-build-agent-${Environment}'
      PackageType: Image
      MemorySize: 512
      Timeout: 60
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref BuildsBucket
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/build
            Method: POST
    Metadata:
      DockerTag: latest
      DockerContext: ../lambda/build-agent
      Dockerfile: Dockerfile

  InstallScriptFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'lolabot-install-script-${Environment}'
      Handler: handler.handler
      CodeUri: ../lambda/install-script/
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/install/{id}
            Method: GET

  PersonalitiesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'lolabot-personalities-${Environment}'
      Handler: handler.handler
      CodeUri: ../lambda/personalities/
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref SiteBucket
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/personalities
            Method: GET

  # ---------- CloudFront ----------

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        HttpVersion: http2and3
        Origins:
          # Static site from S3
          - Id: S3Origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !Ref CloudFrontOAC
          # API Gateway
          - Id: ApiOrigin
            DomainName: !Sub '${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized
          Compress: true
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'lolabot-factory-oac-${Environment}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

Outputs:
  SiteUrl:
    Description: CloudFront distribution URL
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'
  ApiUrl:
    Description: API Gateway URL
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/api'
  SiteBucketName:
    Value: !Ref SiteBucket
  BuildsBucketName:
    Value: !Ref BuildsBucket
